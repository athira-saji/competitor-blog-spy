name: Keep Render Monitoring Active

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger monitoring
        run: |
          curl --fail --show-error --silent \
            --max-time 180 \
            -X POST \
            https://competitor-blog-spy-api.onrender.com/api/monitoring/run

          echo "Monitoring request sent successfully."